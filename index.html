<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>otium. — roll for a better brain.</title>

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header class="header">
      <a class="logo" href="#">
        <span class="logo-o">o</span>tium.
      </a>

      <p class="header-note">
        a daily pause for curious minds
      </p>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">
            one roll. one read. your words.
          </p>

          <h1>
            roll for a<br>
            better brain.
          </h1>

          <p class="description">
            Discover one carefully selected article,
            read it and explain what you learned out loud.
          </p>

          <button id="roll-button" type="button">
            roll an article
          </button>
        </div>

        <div class="hero-art">
          <img
            class="dog-logo"
            src="logo-otium.png"
            alt="otium logo with a curious dog"
          >
        </div>
      </section>

      <section
        id="article"
        class="article"
        aria-live="polite"
        hidden
      ></section>
    </main>

    <script src="articles.js"></script>
    <script src="script.js"></script>
  </body>
</html>
