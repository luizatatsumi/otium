<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>otium. — roll your words.</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap");

      :root {
        --ivory: #f5f1e9;
        --paper: #fffdf8;
        --ink: #171716;
        --electric: #ff4b28;
        --line: rgba(23, 23, 22, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 8% 16%, rgba(255, 75, 40, 0.06), transparent 25%),
          var(--ivory);
        color: var(--ink);
        font-family: "Manrope", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--electric);
        outline-offset: 4px;
      }

      .header {
        width: min(100% - 48px, 1280px);
        min-height: 90px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }

      .brand-logo {
        width: 160px;
        height: 54px;
        display: block;
        object-fit: cover;
        object-position: center 52%;
      }

      .header-note {
        margin: 0;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      main {
        width: min(100% - 48px, 960px);
        margin: 0 auto;
      }

      .hero {
        min-height: calc(100vh - 90px);
        padding: clamp(60px, 8vw, 110px) 0 84px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--electric);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: -0.075em;
      }

      h1 {
        max-width: 800px;
        font-size: clamp(54px, 8vw, 104px);
        font-weight: 800;
        line-height: 0.9;
      }

      .intro {
        max-width: 560px;
        margin: 26px auto 0;
        font-size: clamp(18px, 2vw, 24px);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.35;
      }

      .arrow {
        width: 0;
        height: 0;
        margin: clamp(42px, 6vw, 70px) 0 14px;
        border-top: 15px solid var(--electric);
        border-right: 10px solid transparent;
        border-left: 10px solid transparent;
      }

      .wheel-area {
        position: relative;
        width: min(76vw, 430px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .wheel {
  width: min(520px, 78vw);
  aspect-ratio: 1;
  position: relative;
  margin: 28px auto 0;
  cursor: pointer;
  background: #151512;
  border-radius: 48% 52% 46% 54% / 55% 45% 55% 45%;
  transform: rotate(-8deg);
  transition: transform 1.25s cubic-bezier(.18,.88,.2,1);
}

.wheel::before {
  content: "";
  position: absolute;
  inset: 13%;
  background: #fffaf1;
  border-radius: 53% 47% 55% 45% / 45% 54% 46% 55%;
}

.wheel.is-spinning {
  transform: rotate(720deg);
}

.wheel-mark {
  display: none;
}

      .spin-button {
        width: min(100%, 300px);
        min-height: 64px;
        margin-top: 36px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--ivory);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.02em;
        transition: background 160ms ease, transform 160ms ease;
      }

      .spin-button:hover {
        background: var(--electric);
        transform: translateY(-3px);
      }

      .spin-button:disabled {
        cursor: wait;
        opacity: 0.75;
      }

      .microcopy {
        margin: 16px 0 0;
        color: rgba(23, 23, 22, 0.58);
        font-size: 12px;
        font-weight: 600;
      }

      .challenge[hidden] {
        display: none;
      }

      .challenge {
        margin: 0 0 100px;
        padding: clamp(30px, 6vw, 68px);
        border: 1px solid var(--ink);
        border-radius: 34px;
        background: var(--paper);
        scroll-margin-top: 30px;
      }

      .challenge h2 {
        max-width: 760px;
        margin-top: 10px;
        font-size: clamp(42px, 6vw, 78px);
        font-weight: 800;
        line-height: 0.95;
      }

      .write-label {
        display: block;
        margin: 42px 0 14px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      #writing-space {
        width: 100%;
        min-height: 300px;
        padding: 24px;
        resize: vertical;
        border: 1px solid var(--ink);
        border-radius: 18px;
        background: transparent;
        color: var(--ink);
        font-size: clamp(18px, 2vw, 23px);
        line-height: 1.55;
      }

      #writing-space::placeholder {
        color: rgba(23, 23, 22, 0.42);
      }

      .footer {
        width: min(100% - 48px, 1280px);
        min-height: 88px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--line);
      }

      .footer p {
        margin: 0;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .footer p:last-child {
        color: var(--electric);
      }

      @media (max-width: 600px) {
        .header,
        main,
        .footer {
          width: min(100% - 32px, 1280px);
        }

        .header {
          min-height: 74px;
        }

        .brand-logo {
          width: 132px;
          height: 46px;
        }

        .header-note {
          display: none;
        }

        .hero {
          min-height: auto;
          padding: 62px 0 70px;
        }

        h1 {
          font-size: clamp(50px, 14vw, 72px);
        }

        .intro {
          font-size: 18px;
        }

        .wheel-area {
          width: min(82vw, 390px);
        }

        .challenge {
          margin-bottom: 64px;
          padding: 28px 20px;
          border-radius: 24px;
        }

        #writing-space {
          min-height: 250px;
          padding: 18px;
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <header class="header">
      <img
        class="brand-logo"
        src="logo-otium.png"
        alt="otium."
      >

      <p class="header-note">roll for a better brain.</p>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">roll your words.</p>

        <h1>roll to get<br>a topic.</h1>

        <p class="intro">
          One topic. One blank page. Your words.
        </p>

        <div class="arrow" aria-hidden="true"></div>

        <div class="wheel-area">
          <div class="wheel" id="wheel" aria-hidden="true">
            <div class="wheel-mark"></div>
          </div>
        </div>

        <button class="spin-button" id="spin-button" type="button">
          girar
        </button>

        <p class="microcopy">Research if you want. Write without AI.</p>
      </section>

      <section class="challenge" id="challenge" hidden>
        <p class="eyebrow">tema sorteado</p>

        <h2 id="topic"></h2>

        <label class="write-label" for="writing-space">
          suas palavras
        </label>

        <textarea
          id="writing-space"
          placeholder="Comece de onde conseguir."
        ></textarea>
      </section>
    </main>

    <footer class="footer">
      <p>made for human minds.</p>
      <p>otium.</p>
    </footer>

    <script>
      /*
        Estes são temas temporários só para testar o giro.
        Depois vamos trocar esta lista por 100–200 temas.
      */
      const topics = [
        "Escreva sobre uma coisa que você sempre quis dizer e nunca disse.",
        "O que significa ter sucesso para você?",
        "Escreva sobre um lugar que ainda quer conhecer.",
        "Qual opinião sua mudou completamente com o tempo?",
        "O que o mundo deveria levar mais a sério?",
        "Escreva sobre uma memória que você nunca quer perder."
      ];

      const button = document.querySelector("#spin-button");
      const wheel = document.querySelector("#wheel");
      const challenge = document.querySelector("#challenge");
      const topic = document.querySelector("#topic");
      const writingSpace = document.querySelector("#writing-space");

      let previousTopic = "";

      button.addEventListener("click", () => {
        button.disabled = true;
        button.textContent = "girando...";
        wheel.classList.remove("is-spinning");

        void wheel.offsetWidth;
        wheel.classList.add("is-spinning");

        window.setTimeout(() => {
          const availableTopics = topics.filter(
            (item) => item !== previousTopic
          );

          const selectedTopic =
            availableTopics[
              Math.floor(Math.random() * availableTopics.length)
            ];

          previousTopic = selectedTopic;
          topic.textContent = selectedTopic;

          challenge.hidden = false;

          challenge.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

          button.disabled = false;
          button.textContent = "girar outro tema";

          window.setTimeout(() => writingSpace.focus(), 500);
        }, 900);
      });
    </script>
  </body>
</html>
